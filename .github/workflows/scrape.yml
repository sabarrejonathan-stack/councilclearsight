name: VDTI v4.1 quarterly refresh

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap on councils per run (default: all)'
        required: false
        default: ''
      mode:
        description: 'Scope: verified|all'
        required: false
        default: 'verified'
  # Quarterly refresh — first day of Jan/Apr/Jul/Oct at 02:00 UTC
  schedule:
    - cron: '0 2 1 1,4,7,10 *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: scrape-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          pip install requests beautifulsoup4

      - name: Set up Node (for rescore + input build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build scraper input CSV
        run: node scripts/build_scraper_input.mjs

      - name: Run VDTI Scanner v1
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          MODE:  ${{ github.event.inputs.mode }}
        run: |
          args=""
          [ -n "$LIMIT" ] && args="$args --limit $LIMIT"
          python scraper/vdti_scanner.py \
            --input  scraper/data/councils_input.csv \
            --output scraper/data/scrape_results_v41.csv \
            --crm    scraper/data/crm_contacts.csv \
            --workers 80 \
            $args

      - name: Merge scraper results back into per-slug JSONs
        run: node scripts/merge_scraper_into_jsons.mjs

      - name: Rescore all councils (v4.1)
        run: node scripts/rescore_v41.mjs

      - name: Rebuild CRM master from refreshed JSONs
        run: node scripts/build_crm_from_jsons.mjs

      - name: Commit + push refreshed data
        run: |
          git config user.name  "ccs-scraper-bot"
          git config user.email "bot@councilclearsight.org.uk"
          git add client/public/data/ scraper/data/scrape_results_v41.csv scraper/data/crm_contacts.csv scraper/data/crm_contacts_master.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "scraper: VDTI v4.1 quarterly refresh"
            git push
          fi
