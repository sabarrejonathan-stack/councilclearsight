# Netlify configuration for Council ClearSight
# Front-end (Vite) build served as static; server-side tRPC runs via Functions.

[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback — wouter handles client-side routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers — score JSON. 5-minute cache + must-revalidate so users see
# fresh scores within 5 minutes of a publish, not 1 hour. Cheap to revalidate
# (304 if unchanged) and Netlify edge handles the load.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
