# Netlify configuration for Council ClearSight
# Front-end (Vite) build served as static; server-side tRPC runs via Functions.

[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — wouter handles client-side routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers — score JSON refreshes once a day at most.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
