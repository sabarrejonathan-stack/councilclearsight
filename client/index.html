<!doctype html>
<html lang="en-GB" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5, minimum-scale=1" />
    <meta name="theme-color" content="#0f2937" />
    <meta name="color-scheme" content="dark light" />

    <title>Council ClearSight — Independent Transparency Scores for Parish &amp; Town Councils</title>

    <!-- Primary Meta Tags -->
    <meta name="description" content="Council ClearSight — the independent CC-TI transparency score for every parish, town, city and community council in England. 7,031 councils scored on 14 observable indicators across 4 pillars. Free to view. Every claim pinned to evidence." />
    <meta name="keywords" content="parish council transparency, town council accountability, council transparency score, CC-TI, Council ClearSight Transparency Index, local government transparency, parish council governance, council ClearSight, parish council audit" />
    <meta name="author" content="Council ClearSight Ltd" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Council ClearSight" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Council ClearSight — Independent Transparency Scores" />
    <meta property="og:description" content="The independent CC-TI transparency score for every parish, town, city and community council in England. 7,031 councils scored. Every claim pinned to evidence." />
    <meta property="og:url" content="https://www.councilclearsight.org.uk" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CouncilClear" />
    <meta name="twitter:title" content="Council ClearSight — Independent Transparency Scores" />
    <meta name="twitter:description" content="The independent CC-TI transparency score for every parish, town, city and community council in England. 7,031 councils scored, every claim pinned to evidence." />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.councilclearsight.org.uk" />

    <!-- Fonts — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet" />

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://cloud.umami.is" />
    <link rel="dns-prefetch" href="https://api.manus.im" />

    <!-- Structured Data — Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Council ClearSight Ltd",
      "url": "https://www.councilclearsight.org.uk",
      "description": "Independent transparency assessments for parish and town councils in England",
      "foundingDate": "2025",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "GB"
      },
      "sameAs": [
        "https://twitter.com/CouncilClear"
      ]
    }
    </script>

    <!-- Structured Data — WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Council ClearSight",
      "url": "https://www.councilclearsight.org.uk",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.councilclearsight.org.uk/directory?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <!-- Skip to content link for screen readers -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[9999] focus:bg-white focus:text-slate-900 focus:px-4 focus:py-2 focus:rounded focus:shadow-lg focus:text-sm focus:font-medium">
      Skip to main content
    </a>

    <!-- Hidden static form so Netlify Forms detects sample-report-request at build time.
         The actual form submitted by the React app sends to "/" via fetch — Netlify
         routes it to this form by matching the form-name field. -->
    <form name="sample-report-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="role" />
      <input type="text" name="council_slug" />
      <input type="text" name="council_name" />
      <input type="text" name="council_score" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
